name: 3dcasino
version: 0.6.0-beta.4-SNAPSHOT
main: dev.casino3d.CasinoPlugin
api-version: '1.21.8'
softdepend: [Vault, AuthMe]
commands:
  3dcasino:
    description: Manage free-play 3D casino machines
    usage: /3dcasino [menu | create <game> [skin-id] | bet <game> <1-100> | remove [game] | reload-models | reload-language]
permissions:
  3dcasino.machine:
    default: op
  3dcasino.use:
    default: true
  3dcasino.admin:
    default: op
