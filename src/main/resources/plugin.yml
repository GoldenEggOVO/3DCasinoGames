name: 3dcasino
version: 0.6.0-beta.1
main: dev.casino3d.CasinoPlugin
api-version: '26.2'
softdepend: [Vault, AuthMe]
commands:
  3dcasino:
    description: Manage free-play 3D casino machines
    usage: /3dcasino [create <game> [skin-id] | bet <game> <1-100> | remove [game] | reload-models]
permissions:
  3dcasino.machine:
    default: op
  3dcasino.use:
    default: true
