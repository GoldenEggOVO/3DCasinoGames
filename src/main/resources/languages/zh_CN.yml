"menu.rules.blackjack": "每局重新洗一副52张牌。A算1或11，J/Q/K算10。庄家软17停牌；自然21点净赢3:2，其余获胜净赢1:1，平局退本金。要牌／停牌；首两张可加倍再取一张后停牌，加倍后总投注≤100。无分牌、保险、投降。庄家暗牌开局即检查自然21点。返还率取决于策略，本游戏不承诺98%。\n奖励含本金，向下取整至0.01金币。只支持服务器虚拟金币；无自动投注。"
"menu.rules.crash": "单人回合，开局预存爆点；1倍起每30毫秒增加0.01倍。可随时手动领取；自动领取目标1.01～100.00倍必须在开局前设定。目标等于爆点时自动领取成功。离线、关菜单及重启后仍按原时间和目标结算。爆点可低于1倍，立即失败；分布同Limbo，自动目标取整前返还约98%。动作栏每秒最多刷新4次。\n奖励含本金，向下取整至0.01金币。只支持服务器虚拟金币；无自动投注。"
"menu.rules.dice": "均匀掷出0.00～99.99；严格小于所选胜率时获胜。胜率5～95%；总倍率=98÷胜率百分数。取整前理论返还98%。\n奖励含本金，向下取整至0.01金币。只支持服务器虚拟金币；无自动投注。"
"menu.rules.limbo": "预先选择1.01～100.00倍，随机结果达到目标即获胜。结果由均匀10亿种样本和0.98÷(1-u)生成，向下取两位，最高100倍。离散化及金币取整后理论返还略低于98%。\n奖励含本金，向下取整至0.01金币。只支持服务器虚拟金币；无自动投注。"
"menu.rules.plinko": "12层，每层独立50%向左／右，共13槽。下列为投注1金币的总返还：\n{table}\n对称权重640,160,40,20,10,5,2,5,10,20,40,160,640按二项概率归一到98%；取整后略低。\n奖励含本金，向下取整至0.01金币。只支持服务器虚拟金币；无自动投注。"
