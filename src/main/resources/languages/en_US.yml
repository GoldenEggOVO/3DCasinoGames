"menu.rules.blackjack": "A fresh 52-card deck is shuffled each round. Aces count as 1 or 11; J/Q/K count as 10. The dealer stands on soft 17. A natural blackjack pays 3:2 net, other wins pay 1:1 net, and ties return the stake. Hit or stand; with your first two cards, you may double down, receive one card, then stand. Total stake after doubling must not exceed 100. No splitting, insurance, or surrender. The dealer checks the hole card for a natural blackjack at the start. Return depends on strategy; this game does not promise 98%.\nRewards include the stake and are rounded down to 0.01 coins. Only virtual server coins are supported; no automatic betting."
"menu.rules.crash": "Single-player rounds with the crash point stored at the start. The multiplier starts at 1× and increases by 0.01× every 30 milliseconds. Cash out manually at any time; an automatic target from 1.01× to 100.00× must be set before the round. Automatic cash out succeeds when the target equals the crash point. Settlement uses the original time and target even after disconnecting, closing the menu, or restarting. A crash point below 1× causes an immediate loss. The distribution matches Limbo; automatic targets return about 98% before rounding. The action bar refreshes at most four times per second.\nRewards include the stake and are rounded down to 0.01 coins. Only virtual server coins are supported; no automatic betting."
"menu.rules.dice": "Roll uniformly from 0.00 to 99.99; win when the roll is strictly below your chosen win chance. Win chance: 5–95%. Total multiplier = 98 ÷ win chance percentage. Theoretical return before rounding: 98%.\nRewards include the stake and are rounded down to 0.01 coins. Only virtual server coins are supported; no automatic betting."
"menu.rules.limbo": "Choose a target from 1.01× to 100.00× before playing; win if the random result reaches it. Results use one billion equally likely samples and 0.98 ÷ (1 − u), rounded down to two decimals and capped at 100×. Discretization and coin rounding make the theoretical return slightly below 98%.\nRewards include the stake and are rounded down to 0.01 coins. Only virtual server coins are supported; no automatic betting."
"menu.rules.plinko": "12 rows, each independently sending the ball left or right with 50% probability, ending in one of 13 slots. Total returns for a stake of 1 coin:\n{table}\nSymmetric weights 640,160,40,20,10,5,2,5,10,20,40,160,640 are normalized using binomial probabilities to a 98% return; rounding makes it slightly lower.\nRewards include the stake and are rounded down to 0.01 coins. Only virtual server coins are supported; no automatic betting."
